<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="l" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#7cf3ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#0098ea" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#l)"/>
  <circle r="7" cy="12" fill="#7cf3ff" opacity=".8" filter="url(#g)">
    <animate attributeName="cx" values="0;1200" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" cy="12" fill="#fff">
    <animate attributeName="cx" values="0;1200" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="12" r="5" fill="#0b0f1f" stroke="#a78bfa" stroke-width="2"/>
</svg>
