<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-labelledby="t d">
  <title id="t">WebMesh superpowers</title>
  <desc id="d">Four capabilities: Resolve, Profile, Flows and Graph.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101530"/>
      <stop offset="1" stop-color="#0b0f1f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf3ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".7"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #fff; }
      .s { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #94a3b8; }
      .ic { fill: none; stroke: #7cf3ff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .ic2 { fill: none; stroke: #a78bfa; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #7cf3ff; transform-box: fill-box; transform-origin: center; animation: p 2.4s ease-in-out infinite; }
      @keyframes p { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .6; } }
      .mv { animation: mv 2s ease-in-out infinite alternate; }
      @keyframes mv { from { transform: translateX(-3px); } to { transform: translateX(3px); } }
    </style>
  </defs>

  <!-- Resolve -->
  <g transform="translate(0,0)">
    <rect x="1" y="1" width="268" height="208" rx="18" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
    <g transform="translate(28,28)">
      <circle class="ic" cx="14" cy="14" r="11"/>
      <line class="ic" x1="22" y1="22" x2="32" y2="32"/>
      <circle class="dot" cx="14" cy="14" r="3"/>
    </g>
    <text class="t" x="28" y="108">Resolve</text>
    <text class="s" x="28" y="142">.ton → owner, target,</text>
    <text class="s" x="28" y="164">NFT, index</text>
  </g>

  <!-- Profile -->
  <g transform="translate(310,0)">
    <rect x="1" y="1" width="268" height="208" rx="18" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
    <g transform="translate(28,28)">
      <circle class="ic2" cx="17" cy="11" r="8"/>
      <path class="ic2" d="M3 35c0-8 6-13 14-13s14 5 14 13"/>
      <circle class="dot" cx="17" cy="11" r="2.5" style="fill:#a78bfa"/>
    </g>
    <text class="t" x="28" y="108">Profile</text>
    <text class="s" x="28" y="142">balance, status,</text>
    <text class="s" x="28" y="164">every owned domain</text>
  </g>

  <!-- Flows -->
  <g transform="translate(620,0)">
    <rect x="1" y="1" width="268" height="208" rx="18" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
    <g transform="translate(28,28)">
      <g class="mv">
        <path class="ic" d="M2 12h28M23 5l7 7-7 7"/>
      </g>
      <g class="mv" style="animation-direction:alternate-reverse">
        <path class="ic2" d="M32 28H4M11 21l-7 7 7 7"/>
      </g>
    </g>
    <text class="t" x="28" y="108">Flows</text>
    <text class="s" x="28" y="142">who sends what to whom</text>
    <text class="s" x="28" y="164">TON &amp; jettons</text>
  </g>

  <!-- Graph -->
  <g transform="translate(930,0)">
    <rect x="1" y="1" width="268" height="208" rx="18" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
    <g transform="translate(28,28)">
      <line class="ic" x1="6" y1="30" x2="18" y2="8"/>
      <line class="ic" x1="18" y1="8" x2="32" y2="26"/>
      <line class="ic2" x1="6" y1="30" x2="32" y2="26"/>
      <circle class="dot" cx="6" cy="30" r="4"/>
      <circle class="dot" cx="18" cy="8" r="4" style="animation-delay:.6s"/>
      <circle class="dot" cx="32" cy="26" r="4" style="animation-delay:1.2s"/>
    </g>
    <text class="t" x="28" y="108">Graph</text>
    <text class="s" x="28" y="142">shared, growing,</text>
    <text class="s" x="28" y="164">vis-network ready</text>
  </g>
</svg>
