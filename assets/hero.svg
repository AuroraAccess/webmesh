<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1f"/>
      <stop offset="0.55" stop-color="#14123a"/>
      <stop offset="1" stop-color="#04202e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf3ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#0098ea"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7cf3ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#7cf3ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .l{stroke:#6c7cff;stroke-opacity:.35;stroke-width:1.2;stroke-dasharray:6 6;animation:flow 6s linear infinite}
      .n{fill:#7cf3ff;animation:pulse 3s ease-in-out infinite}
      .n:nth-of-type(2n){fill:#a78bfa;animation-delay:.8s}
      .n:nth-of-type(3n){fill:#0098ea;animation-delay:1.6s}
      .sub{font:500 22px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#c7d2fe;letter-spacing:2px}
      .tag{font:600 14px ui-monospace,Menlo,Consolas,monospace;fill:#7cf3ff;letter-spacing:4px}
      @keyframes flow{to{stroke-dashoffset:-120}}
      @keyframes pulse{0%,100%{opacity:.35;r:3}50%{opacity:1;r:6}}
    </style>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <g>
    <line class="l" x1="80" y1="60" x2="220" y2="140"/><line class="l" x1="220" y1="140" x2="140" y2="270"/>
    <line class="l" x1="220" y1="140" x2="330" y2="80"/><line class="l" x1="140" y1="270" x2="300" y2="250"/>
    <line class="l" x1="300" y1="250" x2="330" y2="80"/><line class="l" x1="880" y1="70" x2="1000" y2="150"/>
    <line class="l" x1="1000" y1="150" x2="1120" y2="80"/><line class="l" x1="1000" y1="150" x2="940" y2="280"/>
    <line class="l" x1="940" y1="280" x2="1100" y2="260"/><line class="l" x1="1100" y1="260" x2="1120" y2="80"/>
    <circle class="n" cx="80" cy="60" r="4"/><circle class="n" cx="220" cy="140" r="4"/>
    <circle class="n" cx="140" cy="270" r="4"/><circle class="n" cx="330" cy="80" r="4"/>
    <circle class="n" cx="300" cy="250" r="4"/><circle class="n" cx="880" cy="70" r="4"/>
    <circle class="n" cx="1000" cy="150" r="4"/><circle class="n" cx="1120" cy="80" r="4"/>
    <circle class="n" cx="940" cy="280" r="4"/><circle class="n" cx="1100" cy="260" r="4"/>
  </g>
  <circle r="5" fill="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M80,60 L220,140 L140,270 L300,250 L330,80 L220,140"/></circle>
  <circle r="5" fill="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M880,70 L1000,150 L940,280 L1100,260 L1120,80 L1000,150"/></circle>
  <text x="600" y="110" text-anchor="middle" class="tag">// SOVEREIGN SEARCH GATEWAY</text>
  <text x="600" y="200" text-anchor="middle" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="96" font-weight="800" fill="url(#txt)" letter-spacing="-2">WebMesh</text>
  <text x="600" y="250" text-anchor="middle" class="sub">resolve · profile · map the .ton universe</text>
</svg>
