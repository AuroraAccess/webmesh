<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300">
  <style>
    .t{font:14px ui-monospace,Menlo,Consolas,monospace;fill:#c7d2fe}
    .p{fill:#7cf3ff}.k{fill:#a78bfa}.s{fill:#86efac}.c{fill:#64748b}
    .line{opacity:0;animation:show .1s forwards}
    .l1{animation-delay:.4s}.l2{animation-delay:1.6s}.l3{animation-delay:1.9s}.l4{animation-delay:2.2s}
    .l5{animation-delay:2.5s}.l6{animation-delay:2.8s}.l7{animation-delay:3.1s}.l8{animation-delay:3.4s}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="820" height="300" rx="14" fill="#0b0f1f" stroke="#2a2f55"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/><circle cx="44" cy="22" r="6" fill="#febc2e"/><circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="410" y="27" text-anchor="middle" class="t c">webmesh — zsh</text>
  <text x="24" y="70" class="t line l1"><tspan class="p">❯</tspan> curl webmesh.cc/WebMesh/api/resolve/<tspan class="s">wallet.ton</tspan></text>
  <text x="24" y="105" class="t line l2">{</text>
  <text x="24" y="130" class="t line l3">  <tspan class="k">"name"</tspan>: <tspan class="s">"wallet.ton"</tspan>,</text>
  <text x="24" y="155" class="t line l4">  <tspan class="k">"owner"</tspan>: <tspan class="s">"EQD…7xQ"</tspan>,</text>
  <text x="24" y="180" class="t line l5">  <tspan class="k">"target"</tspan>: <tspan class="s">"UQB…k2M"</tspan>,</text>
  <text x="24" y="205" class="t line l6">  <tspan class="k">"nft"</tspan>: <tspan class="s">"EQC…9aF"</tspan></text>
  <text x="24" y="230" class="t line l7">}</text>
  <text x="24" y="270" class="t line l8"><tspan class="c"># ⚡ served from RAM in ~4ms</tspan>  <tspan class="p">❯</tspan> <tspan class="cur">▋</tspan></text>
</svg>
